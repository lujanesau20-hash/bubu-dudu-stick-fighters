<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Que la página no aparezca en buscadores -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4fb3f6">
  <title>Bubu & Dudu: Stick Fighters</title>
  <script>
    // =====================================================================
    // VERSIÓN DEL JUEGO: cámbiala en CADA actualización.
    // VERSION_VISIBLE: el número que ven los jugadores ("v1.00"). Cada actualización
    //   sube 0.01 (1.01, 1.02…); un cambio grande sube a 1.10, 2.00, etc.
    //   Anota cada versión en CAMBIOS.md.
    // VERSION_JUEGO: la versión técnica (fecha + el mismo número). Se agrega como
    //   ?v=... a todos los archivos (JS, CSS e imágenes de los personajes) para que
    //   los celulares bajen los nuevos y no usen copias viejas.
    // =====================================================================
    var VERSION_VISIBLE = '1.05';
    var VERSION_JUEGO = '2026.11.12-v' + VERSION_VISIBLE;
    document.write('<link rel="stylesheet" href="css/estilo.css?v=' + VERSION_JUEGO + '">');
  </script>
</head>
<body>
  <div id="juego">
    <canvas id="lienzo"></canvas>
    <!-- Controles táctiles (se muestran solo en celular) -->
    <div id="tactil" class="oculto"></div>
    <!-- Menús y pantallas -->
    <div id="pantallas" class="oculto"></div>
    <!-- Botón de pausa (arriba a la derecha) -->
    <button id="btn-pausa" class="oculto" aria-label="Pausa">Pausa</button>
    <!-- Icono de pantalla completa (debajo de "Pausa") -->
    <button id="btn-pantalla" class="oculto" aria-label="Pantalla completa" title="Pantalla completa (F)"></button>
    <!-- Aviso para girar el celular -->
    <div id="girar"><div>📱↻<p>Gira el teléfono para jugar</p></div></div>
  </div>

  <!-- Todos los archivos del juego, en orden, con ?v=VERSION_JUEGO -->
  <script>
    (function () {
      var archivos = [
        // Configuración y utilidades
        'js/config.js',
        'config/balance.js',          // números de balance
        'config/interfaz.js',         // tamaños y opacidades de la interfaz
        'config/personajes.js',       // fuente única de Bubu y Dudu (hojas de sprites)
        'js/utilidades.js',
        // Entrada (teclado y táctil)
        'js/entrada/input.js',
        'js/entrada/tactil.js',
        // Lógica del juego (sin dibujo)
        'js/logica/ataques.js',
        'js/logica/habilidades.js',
        'js/logica/combos.js',
        'js/logica/mejoras.js',       // mejoras de daño de la tienda (por personaje)
        'js/logica/jugador.js',
        'js/logica/enemigos.js',
        'js/logica/jefes.js',
        'js/logica/enemigos_nuevos.js',
        'js/logica/jefes_nuevos.js',
        'js/logica/escenarios.js',
        'js/logica/niveles_isla.js',  // Mundo 1: Isla Flotante en 10 niveles
        'js/logica/mundo.js',
        // Hojas de sprites animadas (las mismas de prueba-personajes.html)
        'js/prueba/animaciones.js',
        'js/prueba/cuadros_datos.js',
        'js/prueba/cuadros.js',
        // Dibujo
        'js/dibujo/camara.js',
        'js/dibujo/efectos.js',
        'js/dibujo/fondos.js',
        'js/dibujo/fondos_nuevos.js',
        'js/dibujo/stickman.js',
        'js/dibujo/ropa.js',
        'js/dibujo/personajes.js',
        'js/dibujo/render.js',
        // Interfaz
        'js/ui/hud.js',
        'js/ui/tienda.js',
        'js/ui/menus.js',
        'js/ui/selector_niveles.js',
        // Juego en línea: PeerJS (versión fija, sin ?v) + configuración + sincronización
        'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js',
        'config/red.js',
        'js/red/sincronizacion.js',
        'js/red/enlinea.js',
        'js/ui/menu_enlinea.js',
        'js/ui/pausa.js',             // botón y menús de pausa
        'js/ui/depuracion.js',        // panel de depuración (F3 o 5 toques en la esquina)
        // Arranque
        'js/main.js',
      ];
      for (var i = 0; i < archivos.length; i++) {
        var url = /^https?:/.test(archivos[i]) ? archivos[i] : archivos[i] + '?v=' + encodeURIComponent(VERSION_JUEGO);
        document.write('<script src="' + url + '"><\/script>');
      }
    })();
  </script>
</body>
</html>
