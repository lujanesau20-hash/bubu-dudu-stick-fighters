<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Que la página no aparezca en buscadores -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4fb3f6">
  <title>Bubu & Dudu: Stick Fighters</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div id="juego">
    <canvas id="lienzo"></canvas>
    <!-- Controles táctiles (se muestran solo en celular) -->
    <div id="tactil" class="oculto"></div>
    <!-- Menús y pantallas -->
    <div id="pantallas" class="oculto"></div>
    <!-- Botón de pausa (arriba a la derecha) -->
    <button id="btn-pausa" class="oculto" aria-label="Pausa">Pausa</button>
    <!-- Aviso para girar el celular -->
    <div id="girar"><div>📱↻<p>Gira el teléfono para jugar</p></div></div>
  </div>

  <!-- Configuración y utilidades -->
  <script src="js/config.js"></script>
  <!-- Números de balance (vida, maná, daño, enfriamientos, corazones) -->
  <script src="config/balance.js"></script>
  <script src="js/utilidades.js"></script>
  <!-- Entrada (teclado y táctil) -->
  <script src="js/entrada/input.js"></script>
  <script src="js/entrada/tactil.js"></script>
  <!-- Lógica del juego (sin dibujo) -->
  <script src="js/logica/ataques.js"></script>
  <script src="js/logica/habilidades.js"></script>
  <script src="js/logica/combos.js"></script>
  <script src="js/logica/jugador.js"></script>
  <script src="js/logica/enemigos.js"></script>
  <script src="js/logica/jefes.js"></script>
  <!-- Enemigos y jefes de los niveles 2, 3 y 4 -->
  <script src="js/logica/enemigos_nuevos.js"></script>
  <script src="js/logica/jefes_nuevos.js"></script>
  <script src="js/logica/escenarios.js"></script>
  <!-- Mundo 1: Isla Flotante en 10 niveles (datos en config/balance.js) -->
  <script src="js/logica/niveles_isla.js"></script>
  <script src="js/logica/mundo.js"></script>
  <!-- Hojas de sprites animadas de Bubu y Dudu (las mismas de prueba-personajes.html) -->
  <script src="js/prueba/animaciones.js"></script>
  <script src="js/prueba/cuadros_datos.js"></script>
  <script src="js/prueba/cuadros.js"></script>
  <!-- Dibujo -->
  <script src="js/dibujo/camara.js"></script>
  <script src="js/dibujo/efectos.js"></script>
  <script src="js/dibujo/fondos.js"></script>
  <script src="js/dibujo/fondos_nuevos.js"></script>
  <script src="js/dibujo/stickman.js"></script>
  <script src="js/dibujo/ropa.js"></script>
  <script src="js/dibujo/personajes.js"></script>
  <script src="js/dibujo/render.js"></script>
  <!-- Interfaz -->
  <script src="js/ui/hud.js"></script>
  <script src="js/ui/tienda.js"></script>
  <script src="js/ui/menus.js"></script>
  <script src="js/ui/selector_niveles.js"></script>
  <!-- Red (fase 2, preparada) -->
  <script src="js/red/red.js"></script>
  <!-- Juego en línea: PeerJS (versión fija) + configuración + sincronización -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
  <script src="config/red.js"></script>
  <script src="js/red/sincronizacion.js"></script>
  <script src="js/red/enlinea.js"></script>
  <script src="js/ui/menu_enlinea.js"></script>
  <!-- Botón y menús de pausa (solitario, pareja local y en línea) -->
  <script src="js/ui/pausa.js"></script>
  <!-- Arranque -->
  <script src="js/main.js"></script>
</body>
</html>
